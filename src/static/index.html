<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="club-management-container">
        <h3>Club Management</h3>

        <form id="club-form" class="club-form">
          <div class="form-group">
            <label for="club-name">Club Name:</label>
            <input id="club-name" type="text" required placeholder="Robotics Club" />
          </div>
          <div class="form-group">
            <label for="club-description">Description:</label>
            <textarea id="club-description" rows="3" required placeholder="What is this club about?"></textarea>
          </div>
          <div class="form-group">
            <label for="club-category">Category:</label>
            <input id="club-category" type="text" required placeholder="STEM" />
          </div>
          <div class="form-group">
            <label for="club-location">Location:</label>
            <input id="club-location" type="text" required placeholder="Room 204" />
          </div>
          <button type="submit">Create Club</button>
        </form>

        <div id="club-message" class="message hidden"></div>
        <div id="clubs-list" class="clubs-list"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
